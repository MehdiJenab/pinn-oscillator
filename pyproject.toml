[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-harmonic-oscillator"
version = "1.0.0"
description = "PINN-based Harmonic Oscillator Solver with Web Interface"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=1.26.2",
    "torch>=2.1.1",
    "scipy>=1.11.4",
    "matplotlib>=3.8.2",
]

[project.scripts]
pinn-oscillator = "pinn_harmonic_oscillator.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]